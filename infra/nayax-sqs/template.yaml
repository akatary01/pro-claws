AWSTemplateFormatVersion: "2010-09-09"
Description: Vendistri Nayax SQS transaction delivery relay.

Parameters:
  QueueName:
    Type: String
    Default: vendistri-nayax-transactions
    Description: Unique SQS queue name for this Nayax telemetry connection.
  VendistriTransportUsername:
    Type: String
    Description: Vendistri telemetry provider ID used as Basic Auth username.
  VendistriTelemetryQueueUrl:
    Type: String
    Description: URL of the internal Vendistri telemetry ingestion queue.
  VendistriTelemetryQueueArn:
    Type: String
    Description: ARN of the internal Vendistri telemetry ingestion queue.

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${QueueName}-dlq"
      MessageRetentionPeriod: 1209600

  TransactionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  NayaxSendUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${QueueName}-nayax-send"
      Policies:
        - PolicyName: nayax-send-to-vendistri-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource: !GetAtt TransactionQueue.Arn

  NayaxSendAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref NayaxSendUser

  RelayFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: relay-read-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt TransactionQueue.Arn
        - PolicyName: relay-send-to-vendistri-telemetry
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref VendistriTelemetryQueueArn

  RelayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${QueueName}-relay"
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt RelayFunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          VENDISTRI_USERNAME: !Ref VendistriTransportUsername
          VENDISTRI_TELEMETRY_QUEUE_URL: !Ref VendistriTelemetryQueueUrl
      Code:
        ZipFile: |
          import boto3
          import json
          import os

          USERNAME = os.environ["VENDISTRI_USERNAME"]
          TELEMETRY_QUEUE_URL = os.environ["VENDISTRI_TELEMETRY_QUEUE_URL"]
          SQS = boto3.client("sqs")

          def forward_message(message):
              SQS.send_message(
                  QueueUrl=TELEMETRY_QUEUE_URL,
                  MessageBody=json.dumps({"telemetryId": USERNAME, "message": message}),
              )

          def parse_record_body(body):
              payload = json.loads(body)
              if isinstance(payload, dict) and "Message" in payload:
                  nested = payload["Message"]
                  if isinstance(nested, str):
                      return json.loads(nested)
                  return nested
              return payload

          def handler(event, context):
              failures = []
              for record in event.get("Records", []):
                  message_id = record.get("messageId")
                  try:
                      forward_message(parse_record_body(record.get("body", "{}")))
                  except Exception as exc:
                      print(f"Failed to relay SQS message {message_id}: {exc}")
                      failures.append({"itemIdentifier": message_id})
              return {"batchItemFailures": failures}

  RelayEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TransactionQueue.Arn
      FunctionName: !Ref RelayFunction
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

Outputs:
  NayaxQueueUrl:
    Description: Queue URL to enter in Nayax Core.
    Value: !Ref TransactionQueue
  NayaxAccessKeyId:
    Description: Access Key ID to enter in Nayax Core.
    Value: !Ref NayaxSendAccessKey
  NayaxSecretAccessKey:
    Description: Secret Access Key to enter in Nayax Core. Store securely.
    Value: !GetAtt NayaxSendAccessKey.SecretAccessKey
  AwsRegion:
    Description: AWS region for this queue.
    Value: !Ref AWS::Region
  DeadLetterQueueUrl:
    Description: Queue that receives messages after repeated relay failures.
    Value: !Ref DeadLetterQueue
